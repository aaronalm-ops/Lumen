name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Only platform-tools here; AGP downloads the exact platform and build-tools it needs
          # (licences are accepted by this action), so a renamed SDK package cannot fail the job.
          packages: platform-tools

      - name: List available SDK platforms (diagnostic)
        shell: bash
        continue-on-error: true
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -E "platforms;android-3[5-9]|build-tools;3[6-9]" | sed 's/^ *//' | sort -u | head -40 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Derive version name
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.0-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore (only when the secret exists)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            mkdir -p keys
            echo "${KEYSTORE_BASE64}" | base64 --decode > keys/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keys/release.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded; release will be signed with it."
          else
            echo "No KEYSTORE_BASE64 secret; release will use the debug signing key."
          fi

      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        # 0.8.0: compile errors are copied into the run's annotations, so they can be read without
        # opening the full log.
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Rename APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "lumen-${VERSION_NAME}.apk"
          ls -la lumen-*.apk

      - name: Upload APK artefact
        uses: actions/upload-artifact@v6
        with:
          name: lumen-${{ steps.version.outputs.name }}
          path: lumen-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        # v3 runs on Node 24; GitHub removed Node 20 from hosted runners on 23 September 2026.
        uses: softprops/action-gh-release@v3
        with:
          files: lumen-*.apk
          generate_release_notes: true
