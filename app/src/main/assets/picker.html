<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a Drive folder</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000000; color: #8C8C8C; font-family: sans-serif; }
    #status { position: fixed; left: 20px; right: 20px; bottom: 24px; font-size: 13px; line-height: 18px; }
    #line { position: fixed; left: 0; top: 0; height: 1px; width: 100%; background: #262626; }
    #line > div { height: 1px; width: 0; background: #E8862B; }
  </style>
</head>
<body>
  <div id="line"><div id="fill"></div></div>
  <div id="status">Opening Google Drive</div>
  <script>
    // Google Picker JS API (developers.google.com/workspace/drive/picker). The OAuth token and
    // the API key come from the app through the LumenPicker JavascriptInterface; the picked
    // folder goes back the same way. Folder selection: DocsView(FOLDERS) with
    // setSelectFolderEnabled(true), MIME filter on the folder type.
    function setStatus(text) { document.getElementById('status').textContent = text; }
    function setFill(fraction) { document.getElementById('fill').style.width = Math.round(fraction * 100) + '%'; }
    function onApiLoad() {
      setFill(0.4);
      gapi.load('picker', { callback: onPickerApiLoad, onerror: function () { fail('Could not load the picker'); } });
    }
    function fail(reason) {
      setStatus(reason);
      if (window.LumenPicker) { window.LumenPicker.failed(reason); }
    }
    function onPickerApiLoad() {
      setFill(0.8);
      var token = window.LumenPicker ? window.LumenPicker.token() : '';
      var key = window.LumenPicker ? window.LumenPicker.apiKey() : '';
      if (!token || !key) { fail('Drive not configured'); return; }
      var view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(true)
        .setMimeTypes('application/vnd.google-apps.folder');
      var picker = new google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(token)
        .setDeveloperKey(key)
        .setOrigin(window.location.protocol + '//' + window.location.host)
        .setTitle('Choose your sermon folder')
        .setCallback(onPicked)
        .build();
      setFill(1);
      setStatus('');
      picker.setVisible(true);
    }
    function onPicked(data) {
      var action = data[google.picker.Response.ACTION];
      if (action === google.picker.Action.PICKED) {
        var docs = data[google.picker.Response.DOCUMENTS] || [];
        if (docs.length > 0) {
          var doc = docs[0];
          window.LumenPicker.picked(doc[google.picker.Document.ID], doc[google.picker.Document.NAME] || '');
          return;
        }
        fail('Nothing picked');
      } else if (action === google.picker.Action.CANCEL) {
        window.LumenPicker.cancelled();
      }
    }
    window.addEventListener('error', function (e) { fail('Picker error: ' + (e.message || 'unknown')); });
  </script>
  <script async defer src="https://apis.google.com/js/api.js" onload="onApiLoad()" onerror="fail('Could not reach Google')"></script>
</body>
</html>
