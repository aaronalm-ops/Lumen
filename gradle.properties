# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# GitHub owner used by the in-app update check (BuildConfig.GITHUB_OWNER).
# Override with -PgithubOwner=someone or in ~/.gradle/gradle.properties.
githubOwner=aaronalm-ops

# Google Picker API key (BuildConfig.PICKER_API_KEY). Empty disables the Drive section; CI sets it
# from the PICKER_API_KEY secret with -PpickerApiKey=...
pickerApiKey=
