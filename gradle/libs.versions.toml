[versions]
# Build tooling (verified 2026-10-19, see README for sources)
agp = "9.4.0"
# AGP 9 compiles Kotlin itself (built-in Kotlin). The Compose compiler plugin below pulls
# kotlin-gradle-plugin 2.4.21 onto the build classpath, which AGP allows ("you can use a higher
# KGP version", developer.android.com/build/releases/agp-9-0-0-release-notes), so the compiler
# and the Compose compiler plugin are always the same 2.4.21.
kotlin = "2.4.21"
ksp = "2.3.11"

# AndroidX
composeBom = "2026.09.00"
activityCompose = "1.13.0"
core = "1.19.1"
lifecycle = "2.11.0"
media3 = "1.11.1"
room = "2.8.5"
coroutines = "1.11.0"
# Phase 1a additions (verified 2026-10-21 on developer.android.com/jetpack/androidx/releases/<lib>)
glance = "1.2.0"
palette = "1.0.0"
documentfile = "1.1.0"
# Phase 1b additions (verified 2026-10-21, see README "Phase 1b dependencies")
playServicesAuth = "22.0.0"
coreSplashscreen = "1.2.0"
# 0.4.0 (verified 2026-10-27 on developer.android.com/jetpack/androidx/versions/stable-channel:
# "Window Version 1.5.1", November 19, 2025). window-core carries WindowSizeClass and ships with
# window at the same version; it is named so the version is pinned, as media3-datasource is.
window = "1.5.1"
# 0.5.0 (verified 2026-10-27). media3-cast follows the Media3 version above
# (developer.android.com/media/media3/cast/create-castplayer lists androidx.media3:media3-cast:1.11.1).
# play-services-cast-framework is pinned to 22.3.1, the version media3-cast 1.11.1 is built against
# (androidx/media tag 1.11.1, gradle/libs.versions.toml: gmsPlayServicesCastFrameworkVersion);
# 23.0.0 (19 October 2026) moves to mediarouter 1.9.0-beta01 and is not taken this close to release.
playServicesCastFramework = "22.3.1"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# 0.5.0: Chromecast (CastPlayer, RemoteCastPlayer, the Compose MediaRouteButton).
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCastFramework" }

media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Phase 1b: SimpleCache, CacheDataSource, DefaultHttpDataSource (media3-datasource) and
# StandaloneDatabaseProvider (media3-database). Both are already pulled in by media3-exoplayer;
# they are named here so the version is pinned and the imports are not an accident of transitivity.
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-window-core = { group = "androidx.window", name = "window-core", version.ref = "window" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
